<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <title>Página no encontrada | Iván Waisman, MSc.</title>
  <style>
    :root {
      --text: #251d17;
      --muted: #695a4d;
      --accent: #b88656;
      --accent-strong: #a7703c;
      --border: rgba(110, 83, 59, 0.24);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: linear-gradient(180deg, #fffaf4 0%, #f1eae0 100%);
      color: var(--text);
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .code {
      font-family: Georgia, 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 12vw, 6rem);
      line-height: 1;
      margin: 0;
      color: var(--accent);
    }
    h1 {
      font-family: Georgia, 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      margin: 0.75rem 0 0;
    }
    p { color: var(--muted); margin: 0.9rem 0 2rem; line-height: 1.6; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 0.75rem 1.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a:hover { transform: translateY(-1px); }
    .primary { background: var(--accent-strong); color: #fffaf4; }
    .ghost { border: 1px solid var(--border); color: var(--text); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>
      Puede que el enlace esté roto o que la página se haya movido.<br />
      Desde el inicio vas a encontrar todo.
    </p>
    <div class="actions">
      <a class="primary" href="/">Volver al inicio</a>
      <a class="ghost" href="/intake">Pedir un turno</a>
    </div>
  </main>
</body>
</html>
